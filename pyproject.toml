[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-voice"
version = "0.5.0"
description = "Give life to your agents! Live voice narration for Claude Code and Codex, using a local TTS model."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
dependencies = [
    "kokoro-onnx>=0.4.9",
    "sounddevice>=0.5",
    "numpy>=1.26",
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-voice = "agent_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
